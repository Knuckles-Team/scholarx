[build-system]
requires = ["setuptools>=84.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scholarx"
version = "2.3.6"
description = "Universal Research Paper API — single entry point for arXiv, PMC, bioRxiv, medRxiv, PsyArXiv, OSF, and Semantic Scholar"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12, <3.15"
authors = [{ name = "Repository Maintainers", email = "maintainers@knuckles.team" }]
dependencies = [
    "agent-connector-sdk[mcp]>=0.4.1,<1.0.0",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.4",
    "Levenshtein>=0.27.5",
    "pypdf>=6.21.0",
    "rich>=15.0.0",
    "defusedxml>=0.7.1",
]

[project.optional-dependencies]
mcp = ["agent-connector-sdk[mcp]>=0.4.1,<1.0.0"]
all = ["scholarx[mcp]"]
test = [
    "pytest-xdist>=3.8.0","pytest>=9.1.1", "pytest-asyncio>=1.4.0", "pytest-cov>=7.1.0", "respx>=0.23.1"]

[project.scripts]
scholarx = "scholarx.cli:cli"
scholarx-mcp = "scholarx.mcp_server:mcp_server"

# The one declared connector identity: the fleet name (SDK-CONNECTOR-CONTROL-R071).
[project.entry-points."agent_connector_sdk.connector"]
scholarx-mcp = "scholarx"

[tool.uv.workspace]
members = ["."]

[tool.setuptools.packages.find]
include = ["scholarx*"]

[tool.setuptools.package-data]
scholarx = ["*.json", "*.md", "prompts/**", "skills/**", "ontology/**", "connectors/**",]

[tool.uv]
override-dependencies = [
    "fastmcp-slim[client,server]>=4.1.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E402", "B008", "E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[dependency-groups]
dev = [
    "pytest-timeout>=2.4.0",
]

[tool.vulture]
ignore_names = ["request", "config"]

[tool.pipelines_hooks.ste]
exempt = ["specs/*", "specs/**/*"]

[tool.pipelines.api_integration]
baseline = 50.0
