[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scholarx"
version = "0.28.0"
description = "Universal Research Paper API — single entry point for arXiv, PMC, bioRxiv, medRxiv, PsyArXiv, OSF, and Semantic Scholar"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11, <3.15"
authors = [{ name = "Audel Rouhi", email = "knucklessg1@gmail.com" }]
dependencies = [
    "agent-utilities>=0.49.0",
    "httpx>=0.27",
    "python-dotenv",
    "Levenshtein>=0.26",
    "pypdf>=5.0",
    "rich>=13.0",
]

[project.optional-dependencies]
mcp = ["agent-utilities[mcp]>=0.49.0"]
agent = ["agent-utilities[agent,logfire]>=0.49.0"]
all = ["scholarx[mcp,agent]"]
test = [
    "pytest-xdist>=3.6.0","pytest", "pytest-asyncio", "pytest-cov", "respx"]

[project.scripts]
scholarx = "scholarx.cli:cli"
scholarx-mcp = "scholarx.mcp_server:mcp_server"
scholarx-agent = "scholarx.agent_server:agent_server"

[tool.setuptools.packages.find]
include = ["scholarx*"]

[tool.setuptools.package-data]
scholarx = ["*.json", "*.md", "prompts/**"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E402", "B008", "E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true


[dependency-groups]
dev = [
    "pytest-timeout>=2.4.0",
]

[tool.vulture]
ignore_names = ["request", "config"]
