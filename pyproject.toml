[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scholarx"
version = "2.0.0"
description = "Universal Research Paper API — single entry point for arXiv, PMC, bioRxiv, medRxiv, PsyArXiv, OSF, and Semantic Scholar"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12, <3.15"
authors = [{ name = "Project Maintainers", email = "maintainers@users.noreply.github.com" }]
dependencies = [
    "agent-utilities>=1.27.1,<2.0.0",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.2",
    "Levenshtein>=0.27.3",
    "pypdf>=6.14.2",
    "rich>=15.0.0",
]

[project.optional-dependencies]
mcp = ["agent-utilities[mcp]>=1.27.1,<2.0.0"]
agent = ["agent-utilities[agent-runtime,logfire]>=1.27.1,<2.0.0"]
all = ["scholarx[mcp,agent]"]
test = [
    "pytest-xdist>=3.8.0","pytest>=9.1.1", "pytest-asyncio>=1.4.0", "pytest-cov>=7.1.0", "respx>=0.23.1"]

[project.scripts]
scholarx = "scholarx.cli:cli"
scholarx-mcp = "scholarx.mcp_server:mcp_server"
scholarx-agent = "scholarx.agent_server:agent_server"

[project.entry-points."agent_utilities.skill_providers"]
scholarx = "scholarx.skills"

[project.entry-points."agent_utilities.ontology_providers"]
scholarx = "scholarx.ontology"

[project.entry-points."agent_utilities.source_connector_providers"]
scholarx = "scholarx.connectors"

[project.entry-points."agent_utilities.prompt_providers"]
scholarx = "scholarx.prompts"

[tool.setuptools.packages.find]
include = ["scholarx*"]

[tool.setuptools.package-data]
scholarx = ["*.json", "*.md", "prompts/**", "skills/**", "ontology/**", "connectors/**",]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E402", "B008", "E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true


[dependency-groups]
dev = [
    "pytest-timeout>=2.4.0",
]

[tool.vulture]
ignore_names = ["request", "config"]
