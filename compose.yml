---
services:
  scholarx-agent:
    # image: docker.io/knucklessg1/scholarx:latest
    build:
      context: .
      dockerfile: debug.Dockerfile
    container_name: scholarx-agent
    hostname: scholarx-agent
    command: [ "scholarx-agent" ]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: always
    volumes:
      - ./workspace:/app/workspace
    env_file:
      - .env
    environment:
      - "PYTHONUNBUFFERED=1"
      - "HOST=0.0.0.0"
      - "PORT=9600"
      - "TRANSPORT=stdio"
      - "OSF_TOKEN=${OSF_TOKEN}"
      - "S2_API_KEY=${S2_API_KEY}"
      - "NCBI_API_KEY=${NCBI_API_KEY}"
      - "PROVIDER=openai"
      - "LLM_BASE_URL=${LLM_BASE_URL:-http://host.docker.internal:1234/v1}"
      - "LLM_API_KEY=${LLM_API_KEY:-llama}"
      - "MODEL_ID=${MODEL_ID:-nvidia/nemotron-3-super}"
      - "DEBUG=True"
      - "ENABLE_WEB_UI=True"
      - "ENABLE_OTEL=True"
    ports:
      - "9600:9600"
    healthcheck:
      test: [ "CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9600/health')" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
